<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Brief élève — profils, référentiels 2026-2027, progression par domaines, brief de séance. Données locales.">
<meta name="theme-color" content="#1a4b8c">
<title>Brief élève</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a1a2e;--mute:#5b6478;--line:#dde2ec;--blue:#1a4b8c;--green:#1f8a4c;--orange:#e07a1f;--red:#c0392b;--soft:#eef2f8;--chip:#e8eef8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--card:#1a202b;--ink:#e8ecf3;--mute:#9aa4b8;--line:#2c3444;--blue:#5b9bf0;--green:#3fbf72;--orange:#f29a4a;--red:#ef6b5b;--soft:#222a37;--chip:#263042}}
:root[data-theme="dark"]{--bg:#11151d;--card:#1a202b;--ink:#e8ecf3;--mute:#9aa4b8;--line:#2c3444;--blue:#5b9bf0;--green:#3fbf72;--orange:#f29a4a;--red:#ef6b5b;--soft:#222a37;--chip:#263042}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding:0 0 90px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700}
.cube{width:22px;height:22px;border-radius:5px;background:conic-gradient(var(--green) 0 33%,var(--blue) 0 66%,var(--orange) 0)}
.brand small{font-weight:400;color:var(--mute);margin-left:auto}
#cmd{width:100%;margin-top:8px;padding:12px 14px;border:2px solid var(--blue);border-radius:12px;font-size:16px;background:var(--card);color:var(--ink)}
#preview{margin-top:6px;font-size:13px}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
nav button{flex:1;white-space:nowrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 11px}
button.on,button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
button.ok{background:var(--green);color:#fff;border-color:var(--green)}
button.warn{background:var(--orange);color:#fff;border-color:var(--orange)}
button.ghost{background:transparent}
button.sm{padding:3px 8px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .r{margin-left:auto;display:flex;gap:6px}
.mute{color:var(--mute)}.small{font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;margin:2px 3px 2px 0}
.chip.g{background:color-mix(in srgb,var(--green) 18%,transparent)}.chip.o{background:color-mix(in srgb,var(--orange) 22%,transparent)}.chip.r{background:color-mix(in srgb,var(--red) 20%,transparent)}.chip.b{background:color-mix(in srgb,var(--blue) 20%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px}.stat b{font-size:22px;display:block}
ul.list{list-style:none;margin:0;padding:0}ul.list li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
ul.list li:last-child{border:0}.grow{flex:1;min-width:140px}
.dom{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.st{min-width:96px;font-size:12px;padding:4px 8px;border-radius:999px;border:0;color:#fff}
.s-situer{background:#7c8799}.s-cours{background:var(--blue)}.s-revoir{background:var(--orange)}.s-ok{background:var(--green)}.s-verifier{background:repeating-linear-gradient(45deg,var(--green),var(--green) 6px,var(--orange) 6px,var(--orange) 12px)}
.bar{height:8px;border-radius:9px;background:var(--soft);display:flex;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%}
.brief{background:var(--soft);border-left:4px solid var(--orange);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:70px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.alert{border-left:4px solid var(--orange);background:color-mix(in srgb,var(--orange) 12%,transparent);padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;gap:10px;align-items:center;z-index:9;max-width:92vw}
#toast button{background:transparent;color:var(--bg);border-color:var(--bg)}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details summary{cursor:pointer;font-weight:600}
@media print{header,nav,#toast,.noprint,button{display:none!important}body{background:#fff;color:#000}.card{border:0;page-break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><span class="cube" aria-hidden="true"></span>Brief élève <small id="yearLbl"></small></div>
  <input id="cmd" autocomplete="off" placeholder="« Lucas, première, spé maths » · « Lucas, blocage : dérivation » · « Lucas, 2/3 suites » · « Lucas, DS le 12/12 »   ( / pour revenir ici )" aria-label="Saisie rapide">
  <div id="preview" class="mute"></div>
  <nav id="tabs">
    <button data-v="today" class="on">Aujourd'hui</button><button data-v="student">Élève</button><button data-v="registry">Registre</button><button data-v="data">Données</button>
  </nav>
</div></header>
<main class="wrap" id="main"></main>
<div id="toast"><span id="toastMsg"></span><button id="undoBtn" class="sm">Annuler</button></div>

<script src="brief-eleve-referentiels.js"></script>
<script>
'use strict';
const REG = window.BRIEF_REGISTRY;
const KEY = 'brief_eleve_v2';
const TODAY = () => new Date().toISOString().slice(0, 10);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ');
const days = (a, b = TODAY()) => Math.round((new Date(a) - new Date(b)) / 864e5);
const fmtD = d => d ? new Date(d + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const STATES = { situer: 'À situer', cours: 'En cours', revoir: 'À revoir', ok: 'Maîtrisé', verifier: 'À vérifier' };
const VO = { college: 'collège', generale: 'générale', techno: 'technologique', gt: 'GT', pro: 'pro', bts: 'BTS' };
const SPL = { 'spe-maths': 'spé maths', 'spe-pc': 'spé PC', 'spe-svt': 'spé SVT', 'maths-expertes': 'maths expertes', 'maths-comp': 'maths complémentaires', 'spe-nsi': 'NSI', 'spe-si': 'SI' };
const profil = st => `${st.level || 'niveau ?'}${st.voie ? ' ' + VO[st.voie] : ''}${st.specs.length ? ' · ' + st.specs.map(x => SPL[x] || x).join(', ') : ''}`;
const CYCLE = ['situer', 'cours', 'revoir', 'ok'];
const INTERVALS = [7, 21, 60, 120]; // jours avant re-vérification d'un domaine maîtrisé (répétition espacée)

// ---------------- Stockage ----------------
function defaultYear() { const d = new Date(); const y = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; return `${y}-${y + 1}`; }
function blank() { return { schema: 2, students: [], settings: { year: defaultYear(), rate: 30, pseudo: false } }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.students) return migrate(s); } catch (e) {}
  try { const old = JSON.parse(localStorage.getItem('brief_eleve')); if (old && Array.isArray(old.students)) return migrate({ ...blank(), students: old.students }); } catch (e) {}
  return blank();
}
function migrate(s) {
  s.schema = 2; s.settings = { ...blank().settings, ...(s.settings || {}) };
  s.students = s.students.map(st => ({ id: st.id || uid(), name: st.name || 'Sans nom', alias: st.alias || '', level: st.level || '', voie: st.voie || '', specs: st.specs || [],
    refs: st.refs || { confirmed: [], ignored: [] }, domains: st.domains || {}, sessions: st.sessions || [], blocages: st.blocages || [], devoirs: st.devoirs || [],
    echeances: st.echeances || [], notes: st.notes || [], chapter: st.chapter || '', parent: st.parent || '', created: st.created || TODAY() }));
  s.students.forEach((st, i) => { if (!st.alias) st.alias = 'Élève-' + String(i + 1).padStart(2, '0'); });
  return s;
}
let S = load(), undoStack = [], view = 'today', cur = null, pending = null;
function save(msg, snapshot) {
  if (snapshot) { undoStack.push(snapshot); if (undoStack.length > 15) undoStack.shift(); }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('⚠ Stockage local indisponible : exporte tes données.'); }
  if (msg) toast(msg, !!snapshot);
  render();
}
const snap = () => JSON.stringify(S);
function toast(m, undo) {
  const t = document.getElementById('toast'); document.getElementById('toastMsg').textContent = m;
  document.getElementById('undoBtn').classList.toggle('hidden', !undo); t.style.display = 'flex';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 5000);
}
document.getElementById('undoBtn').onclick = () => { const p = undoStack.pop(); if (p) { S = JSON.parse(p); save('Action annulée.'); } };
const disp = st => S.settings.pseudo ? st.alias : st.name;
const getSt = id => S.students.find(s => s.id === id);

// ---------------- Référentiels ----------------
const yStart = y => y ? parseInt(y, 10) : null;
function voieOk(ref, voie) {
  if (ref.voie === voie) return true;
  if (ref.voie === 'gt') return voie === 'generale' || voie === 'techno' || voie === 'gt';
  return false;
}
function refStatus(ref, level, year) {
  const from = yStart(ref.fromByLevel?.[level] ?? ref.from), until = yStart(ref.untilByLevel?.[level] ?? ref.until), y = yStart(year);
  if (from && y < from) return 'futur';
  if (until && y > until) return 'ancien';
  return 'actif';
}
function refsFor(st, year = S.settings.year) {
  const out = { confirmed: [], suggested: [], upcoming: [] };
  if (!st.level) return out;
  for (const r of REG.REFS) {
    if (!r.levels.includes(st.level) || !voieOk(r, st.voie)) continue;
    const status = refStatus(r, st.level, year);
    if (status === 'futur') { out.upcoming.push(r); continue; }
    if (status === 'ancien') continue;
    if (st.refs.ignored.includes(r.id)) continue;
    if (!r.requires || st.specs.includes(r.requires) || st.refs.confirmed.includes(r.id)) out.confirmed.push(r);
    else out.suggested.push(r);
  }
  return out;
}

// ---------------- Progression ----------------
const dk = (rid, d) => rid + '::' + d;
function dom(st, rid, d) { return st.domains[dk(rid, d)] || { state: 'situer', streak: 0, hist: [] }; }
function effState(rec) {
  if (rec.state !== 'ok' || !rec.okDate) return rec.state;
  return days(TODAY(), rec.okDate) >= INTERVALS[Math.min(rec.streak - 1, 3)] ? 'verifier' : 'ok';
}
function setState(st, rid, d, state, extra = {}) {
  const k = dk(rid, d), rec = { ...dom(st, rid, d), ...extra };
  if (state === 'ok') { rec.streak = Math.min((rec.state === 'ok' ? rec.streak : 0) + 1, 4); rec.okDate = TODAY(); }
  else if (state === 'revoir') rec.streak = 0;
  rec.state = state; rec.last = TODAY(); st.domains[k] = rec;
}
function addScore(st, rid, d, s, m) {
  const ratio = s / m, rec = dom(st, rid, d);
  rec.hist = [...(rec.hist || []), { d: TODAY(), s, m }].slice(-12); st.domains[dk(rid, d)] = rec;
  setState(st, rid, d, ratio >= 0.8 ? 'ok' : ratio >= 0.5 ? 'cours' : 'revoir');
}
function allDomains(st) { const r = refsFor(st).confirmed; return r.flatMap(ref => ref.domains.map(d => ({ ref, d, rec: dom(st, ref.id, d) }))); }
function matchDomain(st, q) {
  const toks = norm(q).split(/[^a-z0-9]+/).filter(t => t.length >= 3); if (!toks.length) return null;
  let best = null, bs = 0;
  for (const x of allDomains(st)) { const n = norm(x.d); const sc = toks.reduce((a, t) => a + (n.includes(t) ? 1 : n.includes(t.slice(0, 5)) ? 0.6 : 0), 0); if (sc > bs) { bs = sc; best = x; } }
  return bs >= 0.6 ? best : null;
}
function prereqsFor(text) { const out = new Set(); for (const [rx, list] of REG.PREREQ) if (rx.test(text)) list.forEach(x => out.add(x)); return [...out]; }
function priorities(st) {
  const openB = st.blocages.filter(b => !b.done), chap = norm(st.chapter), soon = st.echeances.filter(e => e.date && days(e.date) >= 0 && days(e.date) <= 21);
  const preNeeded = new Set(openB.flatMap(b => prereqsFor(b.text + ' ' + (b.domain || ''))).map(norm));
  return allDomains(st).map(x => {
    const es = effState(x.rec), why = []; let sc = { situer: 2, cours: 3, revoir: 4, ok: 0, verifier: 3 }[es];
    why.push(STATES[es]);
    const nd = norm(x.d), toks = nd.split(/[^a-z0-9]+/).filter(t => t.length >= 4);
    if (chap && toks.some(t => chap.includes(t))) { sc += 3; why.push('vu en classe'); }
    const nb = openB.filter(b => norm(b.domain || b.text).split(/[^a-z0-9]+/).some(t => t.length >= 4 && nd.includes(t))).length;
    if (nb) { sc += 2 * nb; why.push(nb + ' blocage' + (nb > 1 ? 's' : '')); }
    if ([...preNeeded].some(p => p.split(' ').some(t => t.length >= 5 && nd.includes(t)))) { sc += 1.5; why.push('prérequis d\'un blocage'); }
    const ev = soon.find(e => toks.some(t => norm(e.label).includes(t)));
    if (ev) { sc += 3; why.push(`${ev.label} dans ${days(ev.date)} j`); }
    if (x.rec.conf >= 3 && (es === 'revoir' || es === 'cours')) { sc += 1; why.push('surconfiance'); }
    if (es === 'verifier') why.push('rappel espacé dû');
    return { ...x, es, sc, why };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc)
    .filter((x, i, arr) => arr.findIndex(y => norm(y.d) === norm(x.d)) === i); // même domaine dans 2 référentiels : une seule ligne
}
function calib(rec, es) {
  if (!rec.conf) return '';
  if (rec.conf >= 3 && (es === 'revoir' || es === 'cours')) return '<span class="chip o" title="L\'élève se sent à l\'aise mais les preuves disent le contraire">surconfiance</span>';
  if (rec.conf <= 1 && es === 'ok') return '<span class="chip b" title="Maîtrisé mais l\'élève ne s\'y sent pas en confiance : le lui montrer">sous-confiance</span>';
  return '';
}

// ---------------- Analyse de la saisie rapide ----------------
const LEVELS = [
  [/\bbts ?1\b|bts premiere/, 'BTS1', 'bts'], [/\bbts ?2\b|bts deuxieme|bts seconde/, 'BTS2', 'bts'], [/\bbts\b/, 'BTS1', 'bts'],
  [/\b6e?me\b|\b6e\b|sixieme/, '6e', 'college'], [/\b5e?me\b|\b5e\b|cinquieme/, '5e', 'college'], [/\b4e?me\b|\b4e\b|quatrieme/, '4e', 'college'], [/\b3e?me\b|\b3e\b|troisieme/, '3e', 'college'],
  [/\b(2de|2nde|seconde)\b/, '2de', 'gt'], [/\b(1re|1ere|premiere)\b/, '1re', null], [/\b(tle|terminale|term)\b/, 'Tle', null]
];
const SPECS = [[/spe(cialite)? ?maths?|\bmaths? spe/, 'spe-maths'], [/spe(cialite)? ?(pc|physique)/, 'spe-pc'], [/spe(cialite)? ?svt/, 'spe-svt'], [/maths? expertes?/, 'maths-expertes'], [/maths? complementaires?/, 'maths-comp'], [/\bnsi\b/, 'spe-nsi'], [/\bspe ?si\b|sciences de l.ingenieur/, 'spe-si']];
const WD = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
function parseDate(t) {
  const n = norm(t), d = new Date(); d.setHours(12);
  let m;
  if ((m = n.match(/(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if ((m = n.match(/\b(\d{1,2})[\/.](\d{1,2})\b/))) { const y = d.getFullYear(); let c = new Date(y, m[2] - 1, m[1], 12); if (c < d && days(c.toISOString().slice(0, 10)) < -30) c = new Date(y + 1, m[2] - 1, m[1], 12); return c.toISOString().slice(0, 10); }
  if (/apres.demain/.test(n)) { d.setDate(d.getDate() + 2); return d.toISOString().slice(0, 10); }
  if (/demain/.test(n)) { d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }
  if ((m = n.match(/dans (\d+) (jour|semaine)/))) { d.setDate(d.getDate() + m[1] * (m[2] === 'jour' ? 1 : 7)); return d.toISOString().slice(0, 10); }
  for (let i = 0; i < 7; i++) if (new RegExp('\\b' + WD[i] + '\\b').test(n)) { let k = (i - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + k); return d.toISOString().slice(0, 10); }
  return null;
}
const stripDate = t => t.replace(/\b(pour|le|avant|d.ici)?\s*(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.]\d{1,2}|apr[eè]s-?demain|demain|dans \d+ (jours?|semaines?)|(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche))\b/gi, '').replace(/\s+/g, ' ').trim();
const CMDRX = /^(blocage|bloqu|devoirs?|dm|exos?|exercices?|ds|contr|interro|[ée]valuation|bac|brevet|examen|eam|ccf|s[ée]ance|cours|chapitre|en classe|\d+\s*\/|ok|acquis|ma[iî]tris|à revoir|a revoir|revoir|en cours|confiance|se sent|parent|contact)/i;
function parseCmd(raw) {
  const parts = raw.split(/[,;]/).map(s => s.trim()).filter(Boolean); if (!parts.length) return null;
  let name = parts.shift(), st = S.students.find(s => norm(s.name) === norm(name) || norm(s.alias) === norm(name));
  const ops = []; const prof = { level: null, voie: null, specs: [] };
  if (!st && parts.length === 0 && cur && CMDRX.test(name)) { parts.push(name); st = getSt(cur); name = st.name; } // saisie sans nom = élève ouvert
  for (const p of parts) {
    const n = norm(p); let m, used = false;
    for (const [rx, lv, v] of LEVELS) if (rx.test(n)) { prof.level = lv; if (v) prof.voie = v; used = true; break; }
    if (/\b(generale?|gen)\b/.test(n)) { prof.voie = 'generale'; used = true; }
    if (/\b(techno|sti2d|stmg|st2s|stl)\b/.test(n)) { prof.voie = 'techno'; used = true; }
    if (/\b(bac ?pro|pro|melec|cap)\b/.test(n)) { prof.voie = 'pro'; used = true; }
    for (const [rx, sp] of SPECS) if (rx.test(n)) { prof.specs.push(sp); used = true; }
    if (used) continue;
    if ((m = p.match(/^(blocage|bloque|bloqué)\s*(sur)?\s*:?\s*(.+)/i))) ops.push({ t: 'blocage', text: m[3] });
    else if ((m = p.match(/^(devoirs?|dm|exos?|exercices?)\s*:?\s*(.+)/i))) ops.push({ t: 'devoir', text: stripDate(m[2]) || m[2], due: parseDate(m[2]) });
    else if ((m = p.match(/^(ds|contr[oô]le|interro|[ée]valuation|bac|brevet|examen|eam|ccf|bac blanc|brevet blanc)\b\s*:?\s*(.*)/i))) ops.push({ t: 'echeance', label: (m[1] + ' ' + stripDate(m[2])).trim(), date: parseDate(m[2]) });
    else if ((m = p.match(/^(s[ée]ance|cours)\b\s*:?\s*(.*)/i))) { const dm = m[2].match(/(\d+)\s*h\s*(\d+)?|(\d+)\s*min/i); const dur = dm ? (dm[3] ? +dm[3] : +dm[1] * 60 + (+dm[2] || 0)) : 60; ops.push({ t: 'seance', dur, paid: /pay[ée]/i.test(m[2]), note: m[2].replace(/(\d+)\s*h\s*(\d+)?|(\d+)\s*min|pay[ée]e?/gi, '').trim() }); }
    else if ((m = p.match(/^(chapitre|en classe|classe)\s*:?\s*(.+)/i))) ops.push({ t: 'chapitre', text: m[2] });
    else if ((m = p.match(/^(\d+)\s*\/\s*(\d+)\s+(.+)/))) ops.push({ t: 'score', s: +m[1], m: +m[2], q: m[3] });
    else if ((m = p.match(/^(ok|acquis|ma[iî]tris[ée]e?|à revoir|a revoir|revoir|en cours)\s*:?\s*(.+)/i))) ops.push({ t: 'etat', state: /ok|acquis|ma/i.test(m[1]) ? 'ok' : /revoir/i.test(m[1]) ? 'revoir' : 'cours', q: m[2] });
    else if ((m = p.match(/^(confiance|se sent)\s*:?\s*([1-4])\s*(.+)/i))) ops.push({ t: 'conf', v: +m[2], q: m[3] });
    else if ((m = p.match(/^(parent|contact)\s*:?\s*(.+)/i))) ops.push({ t: 'parent', text: m[2] });
    else ops.push({ t: 'note', text: p });
  }
  return { name, st, prof, ops };
}
function describe(pl) {
  if (!pl) return '';

function list(st, key, label, meta) {
  const L = st[key]; if (!L.length) return '<p class="small mute">Rien pour l\'instant.</p>';
  return '<ul class="list">' + L.slice().sort((a, b) => a.done - b.done).map(x => `<li style="${x.done ? 'opacity:.55' : ''}"><input type="checkbox" data-done="${key}:${x.id}" ${x.done ? 'checked' : ''} aria-label="traité"><span class="grow">${label(x)}</span><span class="small mute">${meta(x)}</span><button class="sm ghost" data-del="${key}:${x.id}">✕</button></li>`).join('') + '</ul>';
}
function vRegistry() {
  const years = ['2025-2026', '2026-2027', '2027-2028', '2028-2029'], y = S.settings.year;
  const order = ['6e', '5e', '4e', '3e', '2de', '1re', 'Tle', 'TMELEC', 'BTS1', 'BTS2'];
  const pill = (r, l, v) => { const s = refStatus(r, l, v), old = s === 'actif' && (r.until || r.untilByLevel); return `<span class="chip ${s === 'actif' ? (old ? 'o' : 'g') : ''}" style="${v === y ? 'outline:2px solid var(--blue)' : ''}${s !== 'actif' ? ';opacity:.45' : ''}">${v.slice(2, 4)}-${v.slice(7)} ${s === 'actif' ? '●' : '○'}</span>`; };
  return `${regAlert()}<div class="card"><h2>Calendrier d'application<span class="r"><select data-a="year">${years.map(v => `<option ${v === y ? 'selected' : ''}>${v}</option>`).join('')}</select></span></h2>
  <p class="small mute"><span class="chip g">● vert</span> s'applique · <span class="chip o">● orange</span> ancien programme encore en vigueur · ○ pas en vigueur. Encadré = année choisie. Vérifié le ${REG.VERIFIED}, mise à jour manuelle.</p></div>
  ${order.map(l => { const refs = REG.REFS.filter(r => r.levels.includes(l)); if (!refs.length) return '';
    return `<div class="card"><h2>${l}</h2><ul class="list">${refs.map(r => `<li style="display:block"><b>${esc(r.label)}</b> <span class="chip ${r.certainty >= 90 ? 'g' : r.certainty >= 80 ? 'b' : 'o'}" title="fiabilité du calendrier">${r.certainty} %</span>
      <div class="small mute">${esc(r.text)}${r.note ? ' — ' + esc(r.note) : ''}</div><div>${years.map(v => pill(r, l, v)).join('')}</div>
      <a class="small" href="${r.url}" target="_blank" rel="noopener">texte / page officielle ↗</a>${r.url2 ? ` · <a class="small" href="${r.url2}" target="_blank" rel="noopener">Éduscol ↗</a>` : ''}</li>`).join('')}</ul></div>`; }).join('')}
  <div class="card"><h2>Règles d'association</h2><ul class="small"><li>Première générale : maths de l'enseignement scientifique toujours associées ; spécialité maths si « spé maths ».</li><li>Spécialités SVT / physique-chimie : proposées « à confirmer », jamais supposées.</li><li>Domaines « indicatifs » : repères de travail à aligner sur le texte officiel ; « banque » : thèmes de la banque MELEC du dépôt.</li><li>Sources : <a href="${REG.SOURCES.calendrier}" target="_blank" rel="noopener">calendrier Éduscol</a> · <a href="${REG.SOURCES.mathsGT}" target="_blank" rel="noopener">maths voie GT</a>.</li></ul></div>`;
}
function vData() {
  const bytes = new Blob([JSON.stringify(S)]).size;
  return `<div class="card"><h2>Sauvegarde</h2><p class="small mute">Données dans ce navigateur uniquement (${(bytes / 1024).toFixed(1)} Ko). Exporte régulièrement : un nettoyage du navigateur efface tout.</p>
  <div class="row"><button class="pri" data-a="export">Exporter JSON complet</button><button data-a="safe">Exporter SAFE (pseudonymes)</button><button data-a="mdall">Exporter tout pour Obsidian (.md)</button>
  <label class="row"><button data-a="imp">Importer JSON…</button><input type="file" id="impFile" accept=".json,application/json" class="hidden"></label></div></div>
  <div class="card"><h2>Réglages</h2><div class="row"><label>Tarif horaire par défaut <input type="number" min="0" data-a="rate" value="${S.settings.rate}" style="width:80px"> €</label>
  <label><input type="checkbox" data-a="pseudo" ${S.settings.pseudo ? 'checked' : ''}> Afficher les pseudonymes (vidéoprojection, captures)</label>
  <label>Thème <select data-a="theme"><option value="">auto</option><option value="light">clair</option><option value="dark">sombre</option></select></label></div></div>
  <div class="card"><h2>Saisie rapide — aide-mémoire</h2><table><tr><th>Tu tapes</th><th>Effet</th></tr>
  ${[['Lucas, première, spé maths', 'crée / met à jour le profil et associe les référentiels'], ['Lucas, blocage : signe de la dérivée', 'blocage + domaine reconnu + prérequis à tester'], ['Lucas, devoir : ex 12 p 54 pour vendredi', 'devoir daté'], ['Lucas, DS suites le 12/12', 'échéance (booste les domaines liés à J-21)'], ['Lucas, 2/3 suites', 'mini-test → état du domaine'], ['Lucas, ok dérivation', 'domaine maîtrisé (rappel espacé)'], ['Lucas, confiance 4 suites', 'confiance élève → détecte la surconfiance'], ['Lucas, séance 1h30 payée', 'séance + règlement'], ['Lucas, chapitre : produit scalaire', 'chapitre vu en classe'], ['(élève ouvert) blocage : fractions', 'sans nom = élève affiché']].map(r => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>Zone sensible</h2><button class="ghost" data-a="wipe" style="color:var(--red)">Tout effacer…</button></div>`;
}

// ---------------- Événements ----------------
function bind(m) {
  const st = getSt(cur);
  m.onclick = e => {
    const t = e.target.closest('button,[data-done]'); if (!t) return; const d = t.dataset;
    if (d.open) { cur = d.open; view = 'student'; render(); window.scrollTo(0, 0); return; }
    if (d.copy) return copy(d.copy === 'brief' ? briefText(st) : parentText(st));
    if (d.cy) { const s0 = snap(); const [rid, dn] = d.cy.split('::'); const es = effState(dom(st, rid, dn)); const nx = es === 'verifier' ? 'ok' : CYCLE[(CYCLE.indexOf(es) + 1) % 4]; setState(st, rid, dn, nx); return save(dn + ' → ' + STATES[nx], s0); }
    if (d.conf) { const s0 = snap(); st.refs.confirmed.push(d.conf); st.refs.ignored = st.refs.ignored.filter(x => x !== d.conf); return save('Référentiel confirmé.', s0); }
    if (d.ign) { const s0 = snap(); st.refs.ignored.push(d.ign); return save('Référentiel écarté.', s0); }
    if (d.paid) { const s0 = snap(); const s = st.sessions.find(x => x.id === d.paid); s.paid = !s.paid; return save(s.paid ? 'Séance réglée.' : 'Séance à régler.', s0); }
    if (d.del) { const s0 = snap(); const [k, id] = d.del.split(':'); st[k] = st[k].filter(x => x.id !== id); return save('Supprimé.', s0); }
    if (d.done) { const s0 = snap(); const [k, id] = d.done.split(':'); const x = st[k].find(x => x.id === id); x.done = !x.done; return save(x.done ? 'Marqué comme traité.' : 'Rouvert.', s0); }
    const a = d.a;
    if (a === 'demo') { const s0 = snap(); ['Lucas, première, spé maths', 'Lucas, chapitre : dérivation', 'Lucas, blocage : signe de la dérivée', 'Lucas, 1/3 dérivation', 'Lucas, confiance 4 dérivation', 'Lucas, 3/3 second degré', 'Lucas, DS dérivation dans 10 jours', 'Lucas, devoir : ex 34 p 112 pour demain', 'Lucas, séance 1h30 dérivées'].forEach(c => { const p = parseCmd(c); const keep = undoStack.length; apply(p); undoStack.length = keep; }); undoStack.push(s0); return; }
    if (a === 'print') return window.print();
    if (a === 'md') return download(`${st.alias}.md`, obsidianMd(st), 'text/markdown');
    if (a === 'mdall') return download(`Brief_eleves_${TODAY()}.md`, S.students.map(obsidianMd).join('\n\n---\n\n'), 'text/markdown');
    if (a === 'export') return download(`BriefEleve_COMPLET_${TODAY()}.json`, JSON.stringify(S, null, 1));
    if (a === 'safe') { const c = JSON.parse(snap()); c.students.forEach(s => { s.name = s.alias; s.parent = ''; s.notes = s.notes.map(n => ({ ...n, text: '[note masquée]' })); }); return download(`BriefEleve_SAFE_${TODAY()}.json`, JSON.stringify(c, null, 1)); }
    if (a === 'imp') return document.getElementById('impFile').click();
    if (a === 'rename') { const n = prompt('Nouveau nom :', st.name); if (n) { const s0 = snap(); st.name = n.trim(); save('Renommé.', s0); } return; }
    if (a === 'delst') { if (confirm(`Supprimer définitivement ${st.name} et tout son suivi ?`)) { const s0 = snap(); S.students = S.students.filter(x => x.id !== st.id); cur = null; view = 'today'; save('Élève supprimé.', s0); } return; }
    if (a === 'wipe') { if (prompt('Tape EFFACER pour tout supprimer (pense à exporter avant) :') === 'EFFACER') { const s0 = snap(); S = blank(); save('Tout est effacé.', s0); } return; }
  };
  m.onchange = e => {
    const t = e.target, a = t.dataset.a;
    if (a === 'pick') { cur = t.value; return render(); }
    if (a === 'year') { S.settings.year = t.value; return save('Année ' + t.value); }
    if (a === 'rate') { S.settings.rate = +t.value || 0; return save(); }
    if (a === 'pseudo') { S.settings.pseudo = t.checked; return save(); }
    if (a === 'theme') { try { localStorage.setItem('brief_theme', t.value); } catch (e) {} applyTheme(); return; }
    if (t.id === 'impFile') return importFile(t.files[0]);
    const s0 = snap();
    if (a === 'level') { st.level = t.value; return save('Niveau : ' + t.value, s0); }
    if (a === 'voie') { st.voie = t.value; return save('Voie : ' + t.value, s0); }
    if (a === 'chapter') { st.chapter = t.value; return save('Chapitre en classe mis à jour.', s0); }
    if (t.dataset.spec) { const k = t.dataset.spec; st.specs = t.checked ? [...st.specs, k] : st.specs.filter(x => x !== k); return save(null, s0); }
    if (t.dataset.cf) { const [rid, dn] = t.dataset.cf.split('::'); const r = dom(st, rid, dn); r.conf = +t.value || undefined; st.domains[dk(rid, dn)] = r; return save('Confiance enregistrée.', s0); }
  };
}
function importFile(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => { try {
    const inc = migrate(JSON.parse(rd.result)); const s0 = snap();
    const replace = S.students.length && confirm(`Fichier : ${inc.students.length} élève(s).\nOK = REMPLACER toutes les données actuelles\nAnnuler = FUSIONNER (les élèves de même nom sont mis à jour)`);
    if (replace || !S.students.length) S = inc;
    else inc.students.forEach(n => { const i = S.students.findIndex(o => o.id === n.id || norm(o.name) === norm(n.name)); if (i >= 0) S.students[i] = n; else S.students.push(n); });
    save('Import terminé.', s0);
  } catch (e) { toast('Fichier illisible : ' + e.message); } };
  rd.readAsText(f);
}
function applyTheme() { let t = ''; try { t = localStorage.getItem('brief_theme') || ''; } catch (e) {} if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(); render();
</script>
